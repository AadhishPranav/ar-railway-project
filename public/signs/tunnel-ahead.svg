<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" role="img" aria-label="Railway tunnel ahead on tracks">
  <rect width="200" height="200" rx="16" fill="#0f172a"/>
  <!-- sky -->
  <rect x="0" y="0" width="200" height="90" fill="#1e293b"/>
  <!-- tunnel portal -->
  <path d="M55 90 Q100 45 145 90 L145 155 Q100 130 55 155 Z" fill="#111827" stroke="#64748b" stroke-width="3"/>
  <path d="M65 95 Q100 58 135 95 L135 150 Q100 128 65 150 Z" fill="#000"/>
  <!-- interior darkness gradient -->
  <ellipse cx="100" cy="120" rx="28" ry="22" fill="#000"/>
  <!-- tracks leading into tunnel -->
  <rect x="0" y="155" width="200" height="45" fill="#1e293b"/>
  <line x1="0" y1="168" x2="200" y2="168" stroke="#475569" stroke-width="2.5"/>
  <line x1="0" y1="182" x2="200" y2="182" stroke="#475569" stroke-width="2.5"/>
  <!-- rails converging perspective -->
  <line x1="20" y1="195" x2="88" y2="100" stroke="#94a3b8" stroke-width="3"/>
  <line x1="180" y1="195" x2="112" y2="100" stroke="#94a3b8" stroke-width="3"/>
  <rect x="46" y="175" width="5" height="25" fill="#334155" transform="skewX(-8)"/>
  <rect x="72" y="168" width="5" height="32" fill="#334155"/>
  <rect x="98" y="162" width="5" height="38" fill="#334155"/>
  <rect x="123" y="168" width="5" height="32" fill="#334155" transform="skewX(8)"/>
  <rect x="149" y="175" width="5" height="25" fill="#334155" transform="skewX(12)"/>
  <!-- warning label -->
  <rect x="28" y="28" width="64" height="32" rx="6" fill="#374151" stroke="#CA8A04" stroke-width="2"/>
  <text x="60" y="42" text-anchor="middle" font-family="Arial,sans-serif" font-size="8" font-weight="bold" fill="#CA8A04">TUNNEL</text>
  <text x="60" y="54" text-anchor="middle" font-family="Arial,sans-serif" font-size="8" font-weight="bold" fill="#CA8A04">AHEAD</text>
</svg>
