<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" role="img" aria-label="Danger zone sign">
  <rect width="200" height="200" rx="16" fill="#1a1f2e"/>
  <rect x="30" y="50" width="140" height="100" rx="8" fill="#DC2626" stroke="#fff" stroke-width="4"/>
  <text x="100" y="95" text-anchor="middle" font-family="Arial,sans-serif" font-size="22" font-weight="bold" fill="#fff">DANGER</text>
  <text x="100" y="125" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" font-weight="bold" fill="#fff">ZONE</text>
</svg>
