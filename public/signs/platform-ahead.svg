<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" role="img" aria-label="Railway station platform ahead">
  <rect width="200" height="200" rx="16" fill="#0f172a"/>
  <!-- sky / station canopy -->
  <path d="M20 55 L100 35 L180 55 L180 75 L20 75 Z" fill="#1e3a5f" stroke="#0284C7" stroke-width="2"/>
  <line x1="35" y1="55" x2="35" y2="75" stroke="#0284C7" stroke-width="1.5" opacity="0.6"/>
  <line x1="65" y1="48" x2="65" y2="75" stroke="#0284C7" stroke-width="1.5" opacity="0.6"/>
  <line x1="100" y1="35" x2="100" y2="75" stroke="#0284C7" stroke-width="1.5" opacity="0.6"/>
  <line x1="135" y1="48" x2="135" y2="75" stroke="#0284C7" stroke-width="1.5" opacity="0.6"/>
  <line x1="165" y1="55" x2="165" y2="75" stroke="#0284C7" stroke-width="1.5" opacity="0.6"/>
  <!-- platform slab -->
  <rect x="15" y="115" width="95" height="22" rx="2" fill="#64748b"/>
  <rect x="15" y="113" width="95" height="4" fill="#94a3b8"/>
  <!-- tracks -->
  <rect x="0" y="145" width="200" height="55" fill="#1e293b"/>
  <line x1="0" y1="158" x2="200" y2="158" stroke="#475569" stroke-width="3"/>
  <line x1="0" y1="172" x2="200" y2="172" stroke="#475569" stroke-width="3"/>
  <rect x="108" y="152" width="8" height="40" fill="#334155"/>
  <rect x="128" y="152" width="8" height="40" fill="#334155"/>
  <rect x="148" y="152" width="8" height="40" fill="#334155"/>
  <rect x="168" y="152" width="8" height="40" fill="#334155"/>
  <!-- platform edge line -->
  <line x1="110" y1="115" x2="110" y2="195" stroke="#fbbf24" stroke-width="2" stroke-dasharray="6 4"/>
  <!-- label -->
  <rect x="118" y="88" width="72" height="36" rx="6" fill="#0284C7" stroke="#fff" stroke-width="2"/>
  <text x="154" y="104" text-anchor="middle" font-family="Arial,sans-serif" font-size="9" font-weight="bold" fill="#fff">PLATFORM</text>
  <text x="154" y="118" text-anchor="middle" font-family="Arial,sans-serif" font-size="9" font-weight="bold" fill="#fff">AHEAD</text>
</svg>
